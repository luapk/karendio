  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return { c: c, x: x };
}

function fit() {
  var s = Math.min(window.innerWidth / W, window.innerHeight / H);
  if (s >= 2) s = Math.floor(s);          // integer scale keeps pixels square
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}

function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// seeded RNG so a stage is the same every time it is built
function mulberry(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// colour helpers (cached): hex -> darker / lighter hex

function hexRGB(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
function rgbHex(r, g, b) {
  return '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1);
}
function shade(h, k) {           // k<1 darkens, k>1 lightens toward white
  var key = h + k;
  if (colCache[key]) return colCache[key];
  var c = hexRGB(h), r;
  if (k <= 1) r = rgbHex(c[0] * k, c[1] * k, c[2] * k);
  else r = rgbHex(c[0] + (255 - c[0]) * (k - 1), c[1] + (255 - c[1]) * (k - 1), c[2] + (255 - c[2]) * (k - 1));
  colCache[key] = r;
  return r;
}
function rgba(h, a) { var c = hexRGB(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

function textW(s, sc) { sc = sc || 1; return s.length * 6 * sc - sc; }
function text(s, x, y, col, sc) {
  sc = sc || 1;
  s = String(s).toUpperCase();
  ctx.fillStyle = col;
  for (var i = 0; i < s.length; i++) {
    var g = GLYPH[s[i]] || GLYPH['?'];
    var gx = x + i * 6 * sc;
    for (var j = 0; j < g.length; j++) ctx.fillRect(gx + g[j][0] * sc, y + g[j][1] * sc, sc, sc);
  }
}
function textSh(s, x, y, col, sc, shadowCol) { sc = sc || 1; text(s, x + sc, y + sc, shadowCol || '#0c0a12', sc); text(s, x, y, col, sc); }
function textOut(s, x, y, col, sc, outCol) {
  sc = sc || 1; outCol = outCol || '#0c0a12';
  for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++) if (dx || dy) text(s, x + dx * sc, y + dy * sc, outCol, sc);
  text(s, x, y, col, sc);
}
function textC(s, cx, y, col, sc, mode) {
  sc = sc || 1;
  var x = Math.round(cx - textW(s, sc) / 2);
  if (mode === 'out') textOut(s, x, y, col, sc); else if (mode === 'sh') textSh(s, x, y, col, sc); else text(s, x, y, col, sc);
}

function decorateArm(e, k, p, P, face) {
  var a = p.armF;
  if (!a) return;
  var up = a[0], fi = a[2];
  // a horizontal upper arm has its shoulder at the end nearest the spine, so
  // the cuff belongs on the far end whichever way the arm points
  // three stripes run down the sleeve FROM THE SHOULDER, so the shoulder end
  // has to be found: it is the end of the upper arm nearest the spine
  function sleeve(u) {
    if (!u) return;
    var i;
    if (u[3] >= u[2]) {                       // arm hanging: stripes vertical
      for (i = 0; i < 3; i++) P(u[0] + 1 + i * 2, u[1] + 2, 1, Math.min(5, u[3] - 3), HERO.stripe);
      P(u[0], u[1] + u[3] - 1, u[2], 1, HERO.teeHi);
    } else {                                  // arm out: stripes stacked, at the shoulder
      var sx = Math.abs(u[0]) < Math.abs(u[0] + u[2]) ? u[0] + 1 : u[0] + u[2] - 7;
      for (i = 0; i < 3; i++) P(sx, u[1] + 1 + i * 2, Math.min(5, u[2] - 3), 1, HERO.stripe);
      P(Math.abs(u[0]) > Math.abs(u[0] + u[2]) ? u[0] : u[0] + u[2] - 1, u[1], 1, u[3], HERO.teeHi);
    }
  }
  if (k.type === 'hero') {
    sleeve(a[0]); sleeve(p.armB && p.armB[0]);
    P(fi[0] + 1, fi[1] + 3, fi[2] - 2, 1, HERO.skinSh);   // knuckle line
    // sleeve tattoo: one connected band, never scattered dots - at this size
    // loose specks on skin read as dirt, not ink
    var fo = a[1];
    if (fo[3] >= fo[2]) { P(fo[0] + 1, fo[1] + 3, fo[2] - 2, 1, HERO.tattoo); P(fo[0] + 2, fo[1] + 4, 2, 1, HERO.tattoo); }
    else { P(fo[0] + 2, fo[1] + 1, 1, fo[3] - 2, HERO.tattoo); P(fo[0] + 3, fo[1] + 2, 1, 2, HERO.tattoo); }
  } else if (k.type === 'bruiser') {
    P(fi[0] + 1, fi[1] + 2, 1, 1, '#2a4a8a'); P(fi[0] + 3, fi[1] + 2, 1, 1, '#2a4a8a'); P(fi[0] + 5, fi[1] + 2, 1, 1, '#2a4a8a');
  } else if (k.type === 'knifer' && (e.pose === 'throwup' || e.pose === 'throw' || e.pose === 'idle' || (e.pose && e.pose.indexOf('walk') === 0))) {
    // knife in the near hand
    if (e.pose === 'throw') { P(fi[0] + 6, fi[1] + 2, 10, 2, PAL.chrome); P(fi[0] + 16, fi[1] + 2, 2, 1, PAL.chrome); }
    else { P(fi[0] + 2, fi[1] - 9, 2, 9, PAL.chrome); P(fi[0] + 2, fi[1] - 10, 1, 1, PAL.chrome); P(fi[0] + 1, fi[1] - 1, 4, 1, '#4a3020'); }
  }
}

// ============================================================================
// BACKGROUND
// ----------------------------------------------------------------------------
// A stage is pre-rendered once into a strip (stageW x H) so the per-frame cost
// is one drawImage.  Emissive surfaces (signs, lit windows, lamps) are also
// painted into a transparent `emit` canvas, which is flipped, squashed and
// blurred onto the pavement to make the street read as wet.  Neon signs stay
// live so they can flicker: each has a crisp canvas and a blurred glow canvas.
//
// Vertical layout (y):  0-28 sky/far  28-48 rooflines  50-72 upper windows
//   72-88 fascia+sign  88-95 awning (must clear a standing head at GY-96)
//   96-168 shop window  168-192 base wall   192-200 pavement  200-204 kerb
//   204-216 road.
// ============================================================================
var THEMES = [
  { name: 'SOHO', brick: PAL.brick, mortar: PAL.mortar, cornice: PAL.cornice, rain: false, kana: true, graffiti: false, stalls: false,
    signs: ['ARCADE', 'NOODLE', 'BAR', 'TATTOO', 'RECORDS', 'LIVE', 'PIZZA', 'CLUB', 'XXX', 'OPEN', 'RAMEN', 'DISCO'],
    special: 'KAREN DIO', far: 'city', skyLow: PAL.skyLow, pave: PAL.slab, pave2: PAL.slab2 },
  { name: 'CAMDEN', brick: PAL.brickB, mortar: '#1a1220', cornice: PAL.corniceB, rain: true, kana: false, graffiti: true, stalls: true,
    signs: ['VINYL', 'PUNK', 'MARKET', 'LOCK', 'TATTOO', 'BOOTS', 'KEBAB', 'CYBER', 'CAMDEN', 'STABLES', 'ELECTRIC', 'DOC'],
    special: 'BRIDGE', far: 'canal', skyLow: '#1c2438', pave: '#303040', pave2: '#383848' }
];

var scene = null;          // current stage scene (see buildScene)
var canFilter = ('filter' in ctx);

function brickWall(x, wall, x0, y0, w, h, theme, rng) {
  x.fillStyle = theme.brick[0];
  x.fillRect(x0, y0, w, h);
  // tint variation per brick
  for (var yy = y0; yy < y0 + h; yy += 4) {
    var row = ((yy - y0) / 4) | 0;
    for (var xx = x0 - (row % 2 ? 4 : 0); xx < x0 + w; xx += 8) {
      var r = rng();
      if (r < 0.18) { x.fillStyle = theme.brick[1]; x.fillRect(Math.max(xx, x0), yy, Math.min(7, x0 + w - xx), 3); }
      else if (r < 0.30) { x.fillStyle = theme.brick[2]; x.fillRect(Math.max(xx, x0), yy, Math.min(7, x0 + w - xx), 3); }
    }
  }
  // mortar: horizontal every 4px, staggered verticals
  x.fillStyle = theme.mortar;
  for (yy = y0 + 3; yy < y0 + h; yy += 4) x.fillRect(x0, yy, w, 1);
  for (yy = y0; yy < y0 + h; yy += 4) {
    row = ((yy - y0) / 4) | 0;
    for (xx = x0 + (row % 2 ? 3 : 7); xx < x0 + w; xx += 8) x.fillRect(xx, yy, 1, 3);
  }
}

function makeSign(txt, col, sc, vertical) {
  // crisp text canvas + glow canvas (blurred), both padded
  var pad = 10;
  var tw = vertical ? 5 * sc : textW(txt, sc), th = vertical ? txt.length * 8 * sc - 2 * sc : 7 * sc;
  var w = tw + pad * 2, h = th + pad * 2;
  var crisp = mkCanvas(w, h), glow = mkCanvas(w, h);
  var save = ctx;
  ctx = crisp.x;                           // text() draws through the global ctx
  if (vertical) { for (var i = 0; i < txt.length; i++) text(txt[i], pad, pad + i * 8 * sc, col, sc); }
  else text(txt, pad, pad, col, sc);
  // tube highlight: a lighter pixel line along the top of each stroke
  ctx = save;
  if (canFilter) {
    glow.x.filter = 'blur(' + (2 + sc) + 'px)';
    glow.x.globalAlpha = 0.9;
    glow.x.drawImage(crisp.c, 0, 0);
    glow.x.filter = 'blur(' + (5 + sc * 2) + 'px)';
    glow.x.globalAlpha = 0.6;
    glow.x.drawImage(crisp.c, 0, 0);
    glow.x.filter = 'none';
    glow.x.globalAlpha = 1;
  } else {
    glow.x.globalAlpha = 0.12;
    for (var dx = -3; dx <= 3; dx++) for (var dy = -3; dy <= 3; dy++) glow.x.drawImage(crisp.c, dx, dy);
    glow.x.globalAlpha = 1;
  }
  return { crisp: crisp.c, glow: glow.c, w: w, h: h, pad: pad, tw: tw, th: th };
}

// kana-ish glyph: a 7x7 box of 3-5 random strokes (reads as signage at 1x)
function kanaGlyph(x, gx, gy, col, rng) {
  x.fillStyle = col;
  var n = 3 + (rng() * 3 | 0);
  for (var i = 0; i < n; i++) {
    var horiz = rng() < 0.5, len = 3 + (rng() * 4 | 0);
    var sx = gx + (rng() * (7 - (horiz ? len : 1)) | 0), sy = gy + (rng() * (7 - (horiz ? 1 : len)) | 0);
    x.fillRect(sx, sy, horiz ? len : 1, horiz ? 1 : len);
  }
}

function buildScene(stage) {
  var theme = THEMES[(stage - 1) % THEMES.length];
  var rng = mulberry(1000 + stage * 7919);
  var stageW = W * 7;
  var strip = mkCanvas(stageW, H), emit = mkCanvas(stageW, H);
  var s = strip.x, em = emit.x;
  var signs = [], tvs = [], steams = [], lamps = [];

  // ---------- far layer (parallax 0.25): sky + skyline
  var farW = Math.ceil(stageW * 0.25) + W + 8;
  var far = mkCanvas(farW, H);
  var f = far.x;
  // dithered sky bands
  var bands = [PAL.skyTop, PAL.skyTop, '#0c0818', PAL.skyMid, PAL.skyMid, '#20132f', theme.skyLow];
  for (var b = 0; b < bands.length; b++) { f.fillStyle = bands[b]; f.fillRect(0, b * 10, farW, 12); }
  for (var dd = 0; dd < bands.length - 1; dd++) {      // dither line between bands
    f.fillStyle = bands[dd + 1];
    for (var px = (dd % 2); px < farW; px += 2) f.fillRect(px, dd * 10 + 9, 1, 1);
  }
  f.fillStyle = theme.skyLow; f.fillRect(0, 70, farW, H - 70);
  if (!theme.rain) {
    for (var st = 0; st < 90; st++) { f.fillStyle = rng() < 0.3 ? '#c8c0e0' : '#6a6088'; f.fillRect(rng() * farW | 0, rng() * 40 | 0, 1, 1); }
    // moon
    f.fillStyle = '#f0e8c8'; f.fillRect(farW - 120, 12, 10, 10); f.fillRect(farW - 122, 14, 14, 6); f.fillRect(farW - 118, 10, 6, 14);
    f.fillStyle = '#d8d0b0'; f.fillRect(farW - 118, 15, 2, 2); f.fillRect(farW - 114, 18, 3, 2);
  } else {
    for (var cl = 0; cl < 14; cl++) { f.fillStyle = cl % 2 ? '#1a1428' : '#221a34'; var cw = 30 + rng() * 60; f.fillRect(rng() * farW | 0, 8 + rng() * 30 | 0, cw | 0, 4 + rng() * 5 | 0); }
  }
  // skyline
  var fx = -10;
  while (fx < farW) {
    var tw = 14 + (rng() * 30 | 0), tht = 20 + (rng() * 40 | 0), top = 72 - tht;
    f.fillStyle = rng() < 0.5 ? PAL.far1 : PAL.far2;
    f.fillRect(fx, top, tw, tht + 10);
    if (rng() < 0.3) { f.fillRect(fx + tw / 2 - 1, top - 6, 2, 6); if (rng() < 0.5) { f.fillStyle = '#ff3040'; f.fillRect(fx + tw / 2 - 1, top - 7, 2, 1); } }
    for (var wy = top + 3; wy < 70; wy += 4) for (var wx = fx + 2; wx < fx + tw - 2; wx += 4) {
      if (rng() < 0.28) { f.fillStyle = rng() < 0.75 ? PAL.winFarLit : PAL.glassCool; f.fillRect(wx, wy, 2, 2); }
    }
    fx += tw + (rng() < 0.3 ? 6 : 0);
  }
  if (theme.far === 'canal') {
    // a bridge arch and railing along the horizon
    f.fillStyle = PAL.far3; f.fillRect(0, 62, farW, 10);
    for (var rx = 0; rx < farW; rx += 5) f.fillRect(rx, 58, 1, 4);
    f.fillRect(0, 57, farW, 1);
  }

  // ---------- mid layer (parallax 0.6): taller dark blocks behind the facades
  var midW = Math.ceil(stageW * 0.6) + W + 8;
  var mid = mkCanvas(midW, 60);
  var m = mid.x;
  var mx = -20;
  while (mx < midW) {
    var mw = 40 + (rng() * 70 | 0), mtop = 6 + (rng() * 22 | 0);
    m.fillStyle = rng() < 0.5 ? PAL.far3 : '#2a1e3c';
    m.fillRect(mx, mtop, mw, 60 - mtop);
    m.fillStyle = '#3a2c4c'; m.fillRect(mx, mtop, mw, 1);
    for (var my = mtop + 4; my < 56; my += 7) for (var mxx = mx + 3; mxx < mx + mw - 4; mxx += 7) {
      m.fillStyle = rng() < 0.22 ? (rng() < 0.7 ? PAL.winFarLit : PAL.glassTv) : '#1a1226';
      m.fillRect(mxx, my, 3, 4);
    }
    if (rng() < 0.25) { m.fillStyle = '#4a3a2a'; m.fillRect(mx + 6, mtop - 12, 2, 12); m.fillRect(mx + 2, mtop - 12, 20, 1); }  // crane / aerial
    mx += mw + (rng() < 0.4 ? 8 : 0);
  }

  // ---------- main strip: ground, then lots
  s.fillStyle = theme.skyLow; s.fillRect(0, 0, stageW, H);
  // pavement slabs
  for (var sx = 0; sx < stageW; sx += 16) { s.fillStyle = ((sx / 16) | 0) % 2 ? theme.pave : theme.pave2; s.fillRect(sx, GY, 16, 8); }
  s.fillStyle = PAL.slabLine; for (sx = 0; sx < stageW; sx += 16) s.fillRect(sx, GY, 1, 8); s.fillRect(0, GY + 4, stageW, 1);
  // kerb with diamond band, road
  s.fillStyle = PAL.kerb; s.fillRect(0, GY + 8, stageW, 4);
  s.fillStyle = PAL.kerbDark; s.fillRect(0, GY + 11, stageW, 1);
  for (sx = 4; sx < stageW; sx += 12) { s.fillStyle = PAL.kerbDiamond; s.fillRect(sx, GY + 9, 1, 2); s.fillRect(sx - 1, GY + 9 + 1, 3, 1); s.fillRect(sx, GY + 8, 1, 1); }
  s.fillStyle = PAL.road; s.fillRect(0, GY + 12, stageW, H - GY - 12);
  s.fillStyle = '#242030'; for (sx = 0; sx < stageW; sx += 3) s.fillRect(sx + ((sx / 3 | 0) % 3), GY + 13 + ((sx / 7 | 0) % 9), 1, 1);
  s.fillStyle = PAL.roadLine; for (sx = 0; sx < stageW; sx += 40) s.fillRect(sx, H - 3, 20, 1);
  // drains
  for (sx = 200; sx < stageW; sx += 380 + (rng() * 200 | 0)) {
    s.fillStyle = PAL.drain; s.fillRect(sx, GY + 8, 14, 4);
    s.fillStyle = PAL.steel; for (var g = 1; g < 14; g += 3) s.fillRect(sx + g, GY + 9, 1, 2);
    steams.push({ x: sx + 7, phase: rng() * 6 });
  }

  // lots
  var x0 = 0, lotIndex = 0, specialDone = false, kanaDone = false, carSlots = [];
  var neonCols = [PAL.neon.pink, PAL.neon.cyan, PAL.neon.yellow, PAL.neon.green, PAL.neon.orange, PAL.neon.purple, PAL.neon.red];
  while (x0 < stageW) {
    var lw = 100 + (rng() * 70 | 0);
    if (x0 + lw > stageW - 60) lw = stageW - x0;
    var roof = 28 + (rng() * 20 | 0);
    var isAlley = lotIndex > 0 && rng() < 0.16 && lw > 110;
    var alleyW = isAlley ? 22 : 0;
    var bw = lw - alleyW;                 // building width
    // wall
    brickWall(s, null, x0, roof, bw, GY - roof, theme, rng);
    // cornice + parapet
    s.fillStyle = theme.cornice; s.fillRect(x0, roof, bw, 3); s.fillStyle = shade(theme.cornice, 0.6); s.fillRect(x0, roof + 3, bw, 1);
    s.fillStyle = OUT; s.fillRect(x0, roof - 1, bw, 1);
    for (var pp = x0 + 2; pp < x0 + bw - 2; pp += 8) { s.fillStyle = theme.cornice; s.fillRect(pp, roof - 4, 4, 3); }
    // drainpipe on one edge
    s.fillStyle = shade(theme.brick[2], 0.7); s.fillRect(x0 + bw - 4, roof + 3, 2, GY - roof - 3);
    // upper windows
    var nWin = Math.max(1, (bw - 16) / 24 | 0), wgap = (bw - nWin * 12) / (nWin + 1);
    for (var wi = 0; wi < nWin; wi++) {
      var wx2 = Math.round(x0 + wgap + wi * (12 + wgap)), wy2 = 50;
      s.fillStyle = OUT; s.fillRect(wx2 - 1, wy2 - 1, 14, 20);
      s.fillStyle = PAL.frame; s.fillRect(wx2, wy2, 12, 18);
      var lit = rng();
      var gc = lit < 0.35 ? PAL.glassLit : lit < 0.45 ? PAL.glassCool : lit < 0.55 ? PAL.glassTv : PAL.glass;
      s.fillStyle = gc; s.fillRect(wx2 + 1, wy2 + 1, 10, 16);
      s.fillStyle = PAL.frame; s.fillRect(wx2 + 6, wy2 + 1, 1, 16); s.fillRect(wx2 + 1, wy2 + 8, 10, 1);
      if (gc !== PAL.glass) {
        if (rng() < 0.5) { s.fillStyle = rgba('#7a3a4a', 0.8); s.fillRect(wx2 + 1, wy2 + 1, 3, 16); }   // curtain
        em.fillStyle = rgba(gc, 0.55); em.fillRect(wx2 + 1, wy2 + 1, 10, 16);
        if (gc === PAL.glassTv) tvs.push({ x: wx2 + 1, y: wy2 + 1, w: 10, h: 16, phase: rng() * 9 });
      } else if (rng() < 0.3) { s.fillStyle = '#2a2a34'; s.fillRect(wx2 + 2, wy2 + 12, 8, 5); s.fillStyle = '#4a4a56'; s.fillRect(wx2 + 3, wy2 + 13, 6, 1); }  // A/C unit
      s.fillStyle = theme.cornice; s.fillRect(wx2 - 1, wy2 + 18, 14, 1);   // sill
    }
    // fire escape
    if (rng() < 0.35 && bw > 120) {
      var fex = x0 + 10, few = Math.min(60, bw - 30);
      s.fillStyle = PAL.steel;
      s.fillRect(fex, 46, few, 1); s.fillRect(fex, 74, few, 1);
      for (var r2 = fex; r2 <= fex + few; r2 += 6) s.fillRect(r2, 40, 1, 7);
      s.fillRect(fex, 40, few, 1);
      for (var lad = 0; lad < 5; lad++) s.fillRect(fex + few - 10 + lad * 2, 48 + lad * 5, 6, 1);
      s.fillStyle = PAL.steelHi; s.fillRect(fex, 45, few, 1);
    }
    // graffiti (Camden) on the upper wall
    if (theme.graffiti && rng() < 0.6) {

// rain streaks are a fixed pool scrolled by time, so nothing is allocated per frame
var RAIN = [];
for (var ri = 0; ri < 90; ri++) RAIN.push([Math.random() * (W + 60), Math.random() * H, 6 + Math.random() * 6]);

function drawBackground(t) {
  var sc = scene;
  var cx = Math.round(cam.x);
  // far + mid layers
  ctx.drawImage(sc.far, -Math.round(cx * 0.25), 0);
  ctx.drawImage(sc.mid, -Math.round(cx * 0.6), 0);
  // blinking mast light on the far layer
  if (Math.floor(t * 1.2) % 2 === 0) { ctx.fillStyle = '#ff5060'; ctx.fillRect(((W - 40 - cx * 0.25) % 400 + 400) % 400, 24, 2, 2); }
  // main strip
  ctx.drawImage(sc.strip, -cx, 0);
  // tv / arcade screen flicker
  for (var i = 0; i < sc.tvs.length; i++) {
    var tv = sc.tvs[i], sx = tv.x - cx;
    if (sx < -20 || sx > W) continue;
    var ph = Math.sin(t * 9 + tv.phase) + Math.sin(t * 23 + tv.phase * 2);
    ctx.fillStyle = tv.arcade ? rgba(ph > 0.6 ? '#ffffff' : ph < -0.8 ? '#000000' : PAL.neon.cyan, 0.35) : rgba(ph > 0.5 ? '#c0e0ff' : '#3060c0', 0.4);
    ctx.fillRect(sx, tv.y + (tv.arcade ? 0 : (ph * 3 | 0) + 6), tv.w, tv.arcade ? tv.h : 3);
  }
  // live neon
  for (i = 0; i < sc.signs.length; i++) {
    var sg = sc.signs[i], gx = sg.x - cx;
    if (gx + sg.sign.w < 0 || gx > W) continue;
    var f;
    if (sg.broken) { var n = Math.sin(t * 17 + sg.phase) * Math.sin(t * 5.3 + sg.phase * 3); f = n > -0.2 ? 1 : n > -0.5 ? 0.3 : 0; }
    else f = 0.86 + 0.14 * Math.sin(t * 6 + sg.phase);
    if (f > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = f * 0.85;
      ctx.drawImage(sg.sign.glow, gx, sg.y);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 0.6 + 0.4 * f;
      ctx.drawImage(sg.sign.crisp, gx, sg.y);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = 0.35; ctx.drawImage(sg.sign.crisp, gx, sg.y); ctx.globalAlpha = 1;   // dead tube
    }
  }
  // steam from drains and alleys
  for (i = 0; i < sc.steams.length; i++) {
    var stm = sc.steams[i], sx2 = stm.x - cx;
    if (sx2 < -40 || sx2 > W + 40) continue;
    for (var k = 0; k < 3; k++) {
      var life = ((t * 0.35 + stm.phase + k * 0.33) % 1);
      var w = 6 + life * 22, h = 4 + life * 6, yy = (stm.alley ? GY - 20 : GY + 8) - life * 44;
      ctx.fillStyle = 'rgba(200,200,220,' + (0.10 * (1 - life)) + ')';
      ctx.fillRect(sx2 - w / 2 + Math.sin(t + k) * 3, yy, w, h);
    }
  }
}

function drawWeather(t) {
  if (!scene.theme.rain) return;
  ctx.fillStyle = PAL.rain;
  var cx = cam.x;
  for (var i = 0; i < RAIN.length; i++) {
    var r = RAIN[i];
    var y = (r[1] + t * 420 * (0.7 + (i % 3) * 0.15)) % (H + 20) - 10;
    var x = ((r[0] - t * 60 - cx * 0.4) % (W + 60) + (W + 60)) % (W + 60) - 30;
    ctx.fillRect(x | 0, y | 0, 1, r[2] | 0);
    if (y > GY + 2 && y < GY + 6) { ctx.fillRect((x - 1) | 0, GY + 6, 3, 1); }
  }
}

function startStage() {

  opts = opts || {};

// ============================================================================
// UPDATE
// ============================================================================
var inp = {};
function buildInput(dt) {
  for (var k in buf) if (buf[k] > 0) buf[k] -= dt;
  inp.left = !!keys.left; inp.right = !!keys.right; inp.up = !!keys.up; inp.down = !!keys.down;
}

function startAttack(p, name) {
  var a = ATK[name];
  p.state = name; p.atk = a; p.pose = a.wind; p.st = 0; p.hitSet = {}; p.ghostT = 0;
  SFX.swing();
  if (a.kiai) SFX.kiai(name === 'uppercut');
}

function applyPlayerAttack(p, dt) {
  var a = p.atk;
  if (p.st >= a.active[0]) p.pose = a.pose;
  if (a.ghost) { p.ghostT -= dt; if (p.ghostT <= 0 && p.pose === a.pose) { p.ghostT = 0.04; ghosts.push({ kit: p.kit, x: p.x, y: p.y, face: p.face, pose: p.pose, life: 1 }); } }
  if (p.st >= a.active[0] && p.st <= a.active[1]) {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.dead || e.state === 'ko' || e.state === 'sprawl' || p.hitSet[e.id]) continue;
      if (a.all ? Math.abs(e.x - p.x) < a.reach && Math.abs(e.y - p.y) < 90 : inReach(p, e, a)) {
        p.hitSet[e.id] = true;
        hurtEnemy(e, a, p);
      }
    }
    for (i = knives.length - 1; i >= 0; i--) {
      var kn = knives[i], dx = (kn.x - p.x) * p.face;
      if (dx > 0 && dx < a.reach + 6 && (a.high ? kn.high : !kn.high)) {
        knives.splice(i, 1); spawnSparks(kn.x, kn.y, 8, PAL.chrome, p.face); addScore(50); spawnScore(kn.x, kn.y - 10, 50); SFX.punch(); G.freeze = 0.03;
      }
    }
  }
}

function updatePlayer(dt) {
  var p = player;
  p.st += dt;
  if (p.flash > 0) p.flash -= dt;
  if (p.inv > 0) p.inv -= dt;
  if (p.comboT > 0) { p.comboT -= dt; if (p.comboT <= 0) p.combo = 0; }
  var grounded = p.y >= GY;

  // airborne physics
  if (!grounded || p.vy < 0) {
    p.vy += 900 * dt; p.y += p.vy * dt; p.x += p.vx * dt;
    if (p.y >= GY) {
      p.y = GY; p.vy = 0; grounded = true;
      if (p.state === 'jump' || p.state === 'jumpkick' || p.state === 'uppercut') { p.state = 'idle'; p.pose = 'idle'; p.st = 0; p.vx = 0; spawnDust(p.x, 3); SFX.land(); }
      if (p.state === 'ko') { p.state = 'sprawl'; p.pose = 'sprawl'; p.st = 0; p.vx = 0; spawnDust(p.x, 8); shake(5); }
    }
  }
  var dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);

  switch (p.state) {
    case 'hurt':
      p.x += p.vx * dt; p.vx *= Math.max(0, 1 - 7 * dt);
      if (p.st > 0.34) { p.state = 'idle'; p.pose = 'idle'; p.st = 0; p.inv = 0.6; }
      break;
    case 'ko':
      p.pose = Math.floor(p.st * 9) % 2 ? 'ko2' : 'ko';
      break;
    case 'sprawl':
      break;
    case 'win':
      p.pose = 'win';
      break;
    case 'grabbed': {
      var h = p.holder;
      if (!h || h.state !== 'holding') { p.state = 'idle'; p.pose = 'idle'; p.y = GY; p.holder = null; break; }
      p.face = h.face * -1;
      p.x = h.x + h.face * 30; p.y = GY - 4 + (Math.floor(p.st * 8) % 2 ? 1 : 0); p.pose = 'grabbed';
      if (take('punch') || take('kick')) { p.mash++; spawnSparks(p.x, p.y - 60, 2, '#ffffff'); }
      if (p.mash >= 5) {
        p.mash = 0; p.state = 'idle'; p.pose = 'idle'; p.y = GY; p.inv = 0.5; p.holder = null;
        h.state = 'hurt'; h.pose = 'hurt'; h.st = 0; h.vx = h.face * -90; releaseToken(h);
        spawnWord('BREAK!', p.x, p.y - 108, PAL.neon.cyan, 2); SFX.kick();
      }
      break;
    }
    case 'punch': case 'kick': case 'sweep': case 'lowpunch':
      applyPlayerAttack(p, dt);
      // chain: punch cancels into kick once it has connected or nearly finished
      if (p.state === 'punch' && p.st > 0.13 && take('kick')) { startAttack(p, 'kick'); break; }
      if (p.st >= p.atk.dur) {
        if (inp.down && grounded) { p.state = 'crouch'; p.pose = 'crouch'; } else { p.state = 'idle'; p.pose = 'idle'; }
        p.st = 0; p.atk = null;
      }
      break;
    case 'jumpkick': case 'uppercut':
      applyPlayerAttack(p, dt);
      if (p.state === 'uppercut' && p.st > p.atk.dur && grounded) { p.state = 'idle'; p.pose = 'idle'; p.st = 0; }
      break;
    case 'jump':
      p.pose = 'jump';
      if (take('kick') || take('punch')) { startAttack(p, 'jumpkick'); }
      break;
    default: {
      // idle / walk / crouch
      if (inp.down) {
        p.state = 'crouch'; p.pose = 'crouch';
        if (take('punch')) startAttack(p, 'lowpunch');
        else if (take('kick')) startAttack(p, 'sweep');
        if (dir) p.face = dir;
        break;
      }
      if (take('special')) {
        if (p.meter >= 1) { startAttack(p, 'uppercut'); p.vy = -320; p.vx = p.face * 40; p.meter = 0; p.inv = 0.7; SFX.special(); shake(3); spawnWord('NEON FIST!', p.x, p.y - 118, PAL.neon.pink, 2); G.flashWhite = 0.12; break; }
        else SFX.select();
      }
      if (take('punch')) { if (dir) p.face = dir; startAttack(p, 'punch'); break; }
      if (take('kick')) { if (dir) p.face = dir; startAttack(p, 'kick'); break; }
      if (take('up')) { p.state = 'jump'; p.pose = 'jump'; p.st = 0; p.vy = -350; p.vx = dir * 95; if (dir) p.face = dir; SFX.jump(); spawnDust(p.x, 2); break; }
      if (dir) {
        p.face = dir; p.x += dir * 100 * dt; p.walkD += 100 * dt;
        p.state = 'walk'; p.pose = WALKSEQ[Math.floor(p.walkD / 12) % 4];
      } else {
        p.state = 'idle'; p.pose = Math.floor(G.t * 1.6) % 2 ? 'idle2' : 'idle';
      }
    }
  }
  // stay on the visible screen and inside the stage
  p.x = clamp(p.x, Math.max(12, cam.x + 12), Math.min(scene.stageW - 12, cam.x + W - 12));
}

// enemy tell icon and sound
function setTell(e, high) {
  e.tell = high ? 'high' : 'low';
  if (high) SFX.tellHigh(); else SFX.tellLow();
}

function beginWind(e, def) {
  e.state = 'wind'; e.atk = def; e.st = 0; e.token = true; e.hitSet = {};
  e.pose = def.windPose;
  e.windT = def.wind * Math.max(0.6, 1 - 0.07 * lvl()) * (e.type === 'boss' && e.hp < e.maxHp * 0.4 ? 0.75 : 1);
  setTell(e, def.high);
}

function updateEnemy(e, dt) {
  var p = player;
  e.st += dt;
  if (e.flash > 0) e.flash -= dt;
  // ko physics
  if (e.state === 'ko') {
    e.vy += 900 * dt; e.y += e.vy * dt; e.x += e.vx * dt;
    e.pose = Math.floor(e.st * 9) % 2 ? 'ko2' : 'ko';
    if (e.x < 20 || e.x > scene.stageW - 20) { e.vx *= -0.5; e.x = clamp(e.x, 20, scene.stageW - 20); }
    if (e.y >= GY) { e.y = GY; e.vy = 0; e.vx = 0; e.state = 'sprawl'; e.pose = 'sprawl'; e.st = 0; spawnDust(e.x, 7); shake(3); SFX.land(); }

  }

    return;
  }

  var dx = p.x - e.x, adx = Math.abs(dx);

      } else if (def && def.throwK && e.thinkT <= 0 && adx > 70 && adx < 230 && attackTokenFree()) { beginWind(e, def); e.nextAtk = null; }

    }

        }
      } else if (e.st >= a.active[0] && e.st <= a.active[1] && !p.hitSet[e.id] && !e.hitSet[p.id]) {

function pickAttack(e, adx) {

  switch (e.type) {
    case 'punk': return (L >= 1 && Math.random() < 0.3 + L * 0.05) ? ENEMY_ATK.punkLow : ENEMY_ATK.punkHigh;
    case 'bruiser': return Math.random() < 0.45 ? ENEMY_ATK.bruiserGrab : ENEMY_ATK.bruiserHigh;
    case 'knifer': {
      if (adx < 60) return ENEMY_ATK.kniferJab;
      var d = ENEMY_ATK.kniferThrow; d.high = Math.random() < 0.55; return d;

    }
    case 'boss': {
      var r = Math.random();
      return r < 0.4 ? ENEMY_ATK.bossHigh : r < 0.75 ? ENEMY_ATK.bossLow : ENEMY_ATK.bossKick;
    }
  }
  return null;
}

function spawnWave(dt) {
  if (G.bossActive) return;
  G.spawnT -= dt;
  var alive = 0;
  for (var i = 0; i < enemies.length; i++) if (!enemies[i].dead && enemies[i].state !== 'ko' && enemies[i].state !== 'sprawl') alive++;
  if (alive >= enemyCap() || G.spawnT > 0) return;
  var L = lvl();
  var n = alive === 0 ? 2 : (Math.random() < 0.35 + L * 0.05 ? 2 : 1);
  for (i = 0; i < n && alive + i < enemyCap(); i++) {
    var r = Math.random(), type;
    if (r < 0.62 - L * 0.06) type = 'punk'; else if (r < 0.82 - L * 0.02) type = 'bruiser'; else type = 'knifer';
    if (G.stage === 1 && G.kills < 2) type = 'punk';
    var ahead = Math.random() < 0.7 || player.x < 120;
    var x = ahead ? cam.x + W + 24 + i * 30 : cam.x - 24 - i * 30;
    x = clamp(x, 16, scene.stageW - 16);
    if (Math.abs(x - player.x) < 60) x = player.x + (ahead ? 1 : -1) * 200;
    enemies.push(makeEnemy(type, x));
  }
  G.spawnT = Math.max(1.0, 2.4 - 0.15 * L) + Math.random() * 0.8;
}

function updateKnives(dt) {
  var p = player;
  for (var i = knives.length - 1; i >= 0; i--) {
    var k = knives[i];
    k.x += k.vx * dt; k.spin += dt * 20;
    if (k.x < cam.x - 40 || k.x > cam.x + W + 40) { knives.splice(i, 1); continue; }
    if (Math.abs(k.x - p.x) < 10 && p.inv <= 0 && !(k.high ? isCrouching(p) : isAirborne(p)) && p.state !== 'ko' && p.state !== 'sprawl') {
      knives.splice(i, 1);
      hurtPlayer(2, { x: k.x - k.vx }, { kb: 100 });
    }
  }
}

function updateCamera(dt) {
  var p = player;
  var lookT = (p.state === 'walk' || p.state === 'jump') ? p.face * 34 : p.face * 18;
  cam.look = lerp(cam.look, lookT, Math.min(1, 3 * dt));
  var target = p.x + cam.look - W / 2;
  cam.x = lerp(cam.x, target, Math.min(1, 7 * dt));
  cam.x = clamp(cam.x, cam.min, cam.max);
  if (cam.shake > 0) {
    cam.shake = Math.max(0, cam.shake - 26 * dt);
    cam.sx = Math.round(rnd(-cam.shake, cam.shake)); cam.sy = Math.round(rnd(-cam.shake, cam.shake) * 0.6);
  } else { cam.sx = cam.sy = 0; }
}

function respawnOrGameOver() {
  G.lives--;
  if (G.lives <= 0) { G.state = 'over'; G.st = 0; SFX.over(); return; }
  var x = player.x;
  player = newPlayer(x); player.inv = 2.2;
  // the street clears while she gets up
  for (var i = 0; i < enemies.length; i++) { var e = enemies[i]; if (e.type !== 'boss') e.dead = true; else { e.state = 'rec'; e.st = -1; e.token = false; e.tell = null; e.x = clamp(e.x + (e.x > x ? 90 : -90), 20, scene.stageW - 20); } }
  knives = []; G.timer = 90;
}

function updateWorld(dt) {
  var p = player;
  G.timer -= dt;
  if (G.timer <= 0 && p.state !== 'ko' && p.state !== 'sprawl') { G.timer = 0; p.inv = 0; hurtPlayer(99, null); spawnWord('TIME UP', p.x, p.y - 120, PAL.neon.red, 2); }
  updatePlayer(dt);
  if (p.state === 'sprawl' && p.st > 1.5) respawnOrGameOver();
  for (var i = enemies.length - 1; i >= 0; i--) {
    var e = enemies[i];
    updateEnemy(e, dt);
    if (e.dead) { if (e.type === 'boss') { /* handled in clear */ } enemies.splice(i, 1); }
  }
  updateKnives(dt);
  spawnWave(dt);
  // boss gate
  if (!G.bossActive && !G.boss && p.x >= scene.bossGate) {
    G.bossActive = true;
    cam.min = cam.max = scene.stageW - W;
    var boss = makeEnemy('boss', scene.stageW - 30);
    boss.thinkT = 1.4;
    G.boss = boss; enemies.push(boss);
    G.spawnT = 99;
    spawnWord('BOSS', p.x + 100, p.y - 120, PAL.neon.red, 3);
    SFX.boss(); shake(4); musicSet('boss');
  }
  if (G.boss && G.boss.dead && G.state === 'play') {
    // stage clear
    G.state = 'clear'; G.st = 0; p.state = 'win'; p.pose = 'win'; p.holder = null;
    G.bonus = Math.round(G.timer) * 10 + G.lives * 200; SFX.clear();
    for (i = 0; i < enemies.length; i++) if (enemies[i].state !== 'ko' && enemies[i].state !== 'sprawl') { enemies[i].state = 'ko'; enemies[i].pose = 'ko'; enemies[i].st = 0; enemies[i].vy = -200; enemies[i].vx = (enemies[i].x > p.x ? 1 : -1) * 120; }
  }
  updateCamera(dt);
  updateFx(dt);
}

// ============================================================================
// ATTRACT-MODE AI (drives the same input buffer as the keyboard)
// ============================================================================
var demoAI = { t: 0, evadeT: 0 };
function demoThink(dt) {
  var p = player;
  keys.left = keys.right = keys.down = false;
  demoAI.t -= dt;
  if (!enemies.length || p.state === 'ko' || p.state === 'sprawl') { keys.right = true; return; }
  var near = null, nd = 1e9;
  for (var i = 0; i < enemies.length; i++) { var e = enemies[i]; if (e.dead || e.state === 'ko' || e.state === 'sprawl') continue; var d = Math.abs(e.x - p.x); if (d < nd) { nd = d; near = e; } }
  if (!near) { keys.right = true; return; }
  var dir = near.x > p.x ? 1 : -1;
  var threat = null;
  for (i = 0; i < enemies.length; i++) { e = enemies[i]; if (e.tell && Math.abs(e.x - p.x) < 80) threat = e; }
  for (i = 0; i < knives.length; i++) { var k = knives[i]; if (Math.abs(k.x - p.x) < 70 && (k.vx > 0) === (k.x < p.x)) threat = { tell: k.high ? 'high' : 'low' }; }
  if (threat && Math.random() < 0.85) {
    if (threat.tell === 'high') keys.down = true;
    else if (demoAI.t <= 0) { press('up'); demoAI.t = 0.5; }
    return;
  }
  if (nd > 46) { if (dir > 0) keys.right = true; else keys.left = true; if (p.face !== dir) { if (dir > 0) keys.right = true; else keys.left = true; } }
  else if (demoAI.t <= 0) {
    if (p.face !== dir) { if (dir > 0) keys.right = true; else keys.left = true; }
    if (p.meter >= 1 && Math.random() < 0.5) press('special');
    else press(Math.random() < 0.5 ? 'punch' : 'kick');
    demoAI.t = 0.22;
  }
}

// ============================================================================
// HUD + OVERLAYS
// ============================================================================
function pad6(n) { var s = String(Math.max(0, n | 0)); while (s.length < 6) s = '0' + s; return s; }

function drawBar(x, y, segs, segW, frac, cols) {
  ctx.fillStyle = OUT; ctx.fillRect(x - 1, y - 1, segs * (segW + 1) + 1, 6);
  for (var i = 0; i < segs; i++) {
    var on = (i + 1) / segs <= frac + 0.001;
    var c = on ? (frac > 0.5 ? cols[0] : frac > 0.25 ? cols[1] : cols[2]) : '#2a2434';
    ctx.fillStyle = c; ctx.fillRect(x + i * (segW + 1), y, segW, 4);
    if (on) { ctx.fillStyle = shade(c, 1.35); ctx.fillRect(x + i * (segW + 1), y, segW, 1); }
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(6,4,12,0.78)'; ctx.fillRect(0, 0, W, HUD_H);
  ctx.fillStyle = rgba(PAL.neon.pink, 0.5); ctx.fillRect(0, HUD_H - 1, W, 1);
  // scores
  text('1UP', 6, 3, PAL.neon.pink); text(pad6(G.score), 28, 3, '#fff');
  text('HI', 84, 3, PAL.neon.cyan); text(pad6(G.hi), 100, 3, '#fff');
  // stage + timer
  var st = 'STAGE ' + G.stage;
  text(st, W / 2 - textW(st) / 2 | 0, 3, PAL.neon.yellow);
  var tm = String(Math.max(0, Math.ceil(G.timer)));
  text('TIME', W - 66, 3, PAL.neon.cyan); text(tm, W - 36, 3, G.timer < 15 && Math.floor(G.t * 4) % 2 ? PAL.neon.red : '#fff');
  // health + lives
  text('KAREN', 6, 12, '#fff');
  drawBar(38, 12, 16, 4, player.hp / player.maxHp, [PAL.neon.green, PAL.neon.yellow, PAL.neon.red]);
  for (var i = 0; i < G.lives - 1; i++) text('♥', 124 + i * 7, 12, PAL.neon.pink);
  // special meter
  var full = player.meter >= 1;
  ctx.fillStyle = OUT; ctx.fillRect(151, 13, 32, 4);
  ctx.fillStyle = full && Math.floor(G.t * 6) % 2 ? '#fff' : PAL.neon.cyan; ctx.fillRect(152, 14, Math.round(30 * clamp(player.meter, 0, 1)), 2);
  if (full) text('SP', 186, 12, Math.floor(G.t * 6) % 2 ? '#fff' : PAL.neon.cyan);
  // boss
  if (G.boss && !G.boss.dead && G.boss.state !== 'sprawl') {
    text('BOSS', W - 118, 12, PAL.neon.red);
    drawBar(W - 90, 12, 16, 4, G.boss.hp / G.boss.maxHp, [PAL.neon.red, PAL.neon.red, PAL.neon.orange]);
  }
  // combo counter under the HUD
  if (player.combo >= 2 && player.comboT > 0) {
    var s = player.combo + ' HIT' + (player.combo >= 5 ? ' COMBO' : '');
    textC(s, W / 2, HUD_H + 4, player.combo >= 8 ? PAL.neon.pink : PAL.neon.yellow, 1, 'out');
  }
}

function drawTell(e) {
  if (!e.tell) return;
  var x = Math.round(e.x - cam.x), y = Math.round(e.y) - 108 + (Math.floor(G.t * 10) % 2 ? 1 : 0);
  var col = e.tell === 'high' ? PAL.neon.cyan : PAL.neon.pink;
  // chevrons: high attack -> duck (pointing down); low attack -> jump (pointing up)
  for (var i = 0; i < 3; i++) {
    var yy = e.tell === 'high' ? y - i * 4 : y - 8 + i * 4;
    ctx.fillStyle = OUT; ctx.fillRect(x - 5, yy - 1, 11, 5);
    ctx.fillStyle = col;
    if (e.tell === 'high') { ctx.fillRect(x - 4, yy, 3, 1); ctx.fillRect(x + 2, yy, 3, 1); ctx.fillRect(x - 2, yy + 1, 5, 1); ctx.fillRect(x, yy + 2, 1, 1); }
    else { ctx.fillRect(x, yy, 1, 1); ctx.fillRect(x - 2, yy + 1, 5, 1); ctx.fillRect(x - 4, yy + 2, 3, 1); ctx.fillRect(x + 2, yy + 2, 3, 1); }
  }
}

var logoCache = null;
function drawLogo(cx, y) {
  if (!logoCache) logoCache = { a: makeSign('NEON', PAL.neon.pink, 4), b: makeSign('FIST', PAL.neon.cyan, 4) };
  var f = 0.9 + 0.1 * Math.sin(G.t * 5);
  var a = logoCache.a, b = logoCache.b;
  var totalW = a.tw + 16 + b.tw, x0 = Math.round(cx - totalW / 2);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = f;
  ctx.drawImage(a.glow, x0 - a.pad, y - a.pad); ctx.drawImage(b.glow, x0 + a.tw + 16 - b.pad, y - b.pad);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  // drop shadow then the tubes
  text('NEON', x0 + 2, y + 2, 'rgba(0,0,0,0.6)', 4); text('FIST', x0 + a.tw + 18, y + 2, 'rgba(0,0,0,0.6)', 4);
  ctx.drawImage(a.crisp, x0 - a.pad, y - a.pad); ctx.drawImage(b.crisp, x0 + a.tw + 16 - b.pad, y - b.pad);
  // tube highlight lines
  text('NEON', x0, y - 1, 'rgba(255,255,255,0.35)', 4); text('FIST', x0 + a.tw + 16, y - 1, 'rgba(255,255,255,0.35)', 4);
  ctx.drawImage(a.crisp, x0 - a.pad, y - a.pad); ctx.drawImage(b.crisp, x0 + a.tw + 16 - b.pad, y - b.pad);
}

function drawTitle() {
  // letterbox band for the copy
  ctx.fillStyle = 'rgba(4,2,10,0.55)'; ctx.fillRect(0, 26, W, 62);
  ctx.fillStyle = rgba(PAL.neon.pink, 0.4); ctx.fillRect(0, 26, W, 1); ctx.fillRect(0, 87, W, 1);
  drawLogo(W / 2, 36);
  textC('FEAT. KAREN DIO', W / 2, 74, PAL.neon.yellow, 1, 'sh');
  if (Math.floor(G.t * 2) % 2 === 0) textC('PRESS ENTER', W / 2, 118, '#fff', 1, 'out');
  ctx.fillStyle = 'rgba(4,2,10,0.6)'; ctx.fillRect(0, H - 34, W, 34);
  textC('←→ MOVE  ↑ JUMP  ↓ DUCK   J PUNCH  K KICK  L SPECIAL', W / 2, H - 28, '#c8c0d8', 1);
  textC('DUCK THE CYAN TELL  •  JUMP THE PINK TELL'.replace('•', '-'), W / 2, H - 18, PAL.neon.cyan, 1);
  textC('HI ' + pad6(G.hi) + '    M MUTE  T CRT  P PAUSE', W / 2, H - 8, '#8a8098', 1);
}

function drawIntro() {
  var t = G.st;
  var barH = Math.round(clamp(1 - (t - 1.6) * 2, 0, 1) * 26);
  ctx.fillStyle = '#000'; ctx.fillRect(0, HUD_H, W, barH); ctx.fillRect(0, H - barH, W, barH);
  if (t < 2.2) {
    var a = clamp(t * 3, 0, 1);
    ctx.globalAlpha = a * clamp((2.2 - t) * 3, 0, 1);
    var name = 'STAGE ' + G.stage + '  -  ' + scene.theme.name;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 88, W, 30);
    textC(name, W / 2, 92, PAL.neon.yellow, 2, 'out');
    textC(G.stage === 1 ? 'FIGHT!' : 'GET READY', W / 2, 110, '#fff', 1, 'out');
    ctx.globalAlpha = 1;
  }
}

function drawClear() {
  var t = G.st;
  ctx.fillStyle = 'rgba(0,0,0,' + clamp(t, 0, 0.55) + ')'; ctx.fillRect(0, 60, W, 80);
  textC('STAGE CLEAR', W / 2, 70, PAL.neon.green, 2, 'out');
  if (t > 0.8) textC('TIME BONUS  ' + Math.round(G.timer) * 10, W / 2, 96, '#fff', 1, 'out');
  if (t > 1.4) textC('LIFE BONUS  ' + G.lives * 200, W / 2, 108, '#fff', 1, 'out');
  if (t > 2.0) textC('TOTAL  ' + pad6(G.score), W / 2, 124, PAL.neon.yellow, 1, 'out');
}

function drawOver() {
  var t = G.st;
  ctx.fillStyle = 'rgba(0,0,0,' + clamp(t * 0.5, 0, 0.7) + ')'; ctx.fillRect(0, 0, W, H);
  textC('GAME OVER', W / 2, 78, PAL.neon.red, 3, 'out');
  textC('SCORE ' + pad6(G.score), W / 2, 112, '#fff', 1, 'out');
  if (G.newHi) textC('NEW HIGH SCORE!', W / 2, 124, PAL.neon.yellow, 1, 'out');
  if (t > 1.5 && Math.floor(G.t * 2) % 2 === 0) textC('PRESS ENTER', W / 2, 150, '#fff', 1, 'out');
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  textC('PAUSED', W / 2, 96, '#fff', 2, 'out');
  textC('P RESUME   M MUTE   T CRT', W / 2, 118, '#c8c0d8', 1, 'out');
}

// ============================================================================
// RENDER
// ============================================================================
var vignette = null, scanlines = null;
function buildPost() {
  vignette = mkCanvas(W, H);
  var g = vignette.x.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
  vignette.x.fillStyle = g; vignette.x.fillRect(0, 0, W, H);
  scanlines = mkCanvas(W, H);
  scanlines.x.fillStyle = 'rgba(0,0,0,0.16)';
  for (var y = 0; y < H; y += 2) scanlines.x.fillRect(0, y, W, 1);
  scanlines.x.fillStyle = 'rgba(255,255,255,0.025)';
  for (var x = 0; x < W; x += 3) scanlines.x.fillRect(x, 0, 1, H);
}
buildPost();

function drawKnife(k) {
  var x = Math.round(k.x - cam.x), y = Math.round(k.y);
  var flip = Math.floor(k.spin) % 2;
  ctx.fillStyle = OUT; ctx.fillRect(x - 7, y - 2, 15, 5);
  ctx.fillStyle = PAL.chrome; ctx.fillRect(x - 6, y - 1, 10, flip ? 2 : 3);
  ctx.fillStyle = '#4a3020'; ctx.fillRect(x + 4, y - 1, 3, 3);
  ctx.fillStyle = '#fff'; ctx.fillRect(x - 5, y - 1, 6, 1);
}

function render() {
  var t = G.t;
  ctx.save();
  ctx.translate(cam.sx, cam.sy);
  drawBackground(t);
  // entities: downed ones first, then the rest by x, player last
  var list = [];
  for (var i = 0; i < enemies.length; i++) list.push(enemies[i]);
  list.sort(function (a, b) {
    var da = a.state === 'sprawl' || a.state === 'ko' ? 0 : 1, db = b.state === 'sprawl' || b.state === 'ko' ? 0 : 1;
    return da - db || a.x - b.x;
  });
  for (i = 0; i < list.length; i++) if (list[i].state !== 'ko') drawShadow(list[i]);
  if (player && player.state !== 'ko') drawShadow(player);
  drawFx();       // ghosts come first inside drawFx
  for (i = 0; i < list.length; i++) {
    var e = list[i];
    if (e.state === 'sprawl' && e.st > 1.0 && Math.floor(e.st * 16) % 2) continue;   // blink out
    drawFighter(e);
    drawTell(e);
  }
  if (player) {
    if (!(player.inv > 0 && player.state !== 'hurt' && player.state !== 'uppercut' && Math.floor(G.t * 20) % 2)) drawFighter(player);
  }
  for (i = 0; i < knives.length; i++) drawKnife(knives[i]);
  drawWeather(t);
  ctx.restore();

  // post + overlays
  if (G.flashRed > 0) { ctx.fillStyle = 'rgba(255,40,40,' + (G.flashRed * 1.4) + ')'; ctx.fillRect(0, 0, W, H); }
  if (G.flashWhite > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (G.flashWhite * 4) + ')'; ctx.fillRect(0, 0, W, H); }
  if (G.state === 'title') drawTitle();
  else {
    drawHUD();
    if (G.state === 'intro') drawIntro();
    else if (G.state === 'clear') drawClear();
    else if (G.state === 'over') drawOver();
    if (G.demo && G.state !== 'over' && Math.floor(G.t * 2) % 2 === 0) textC('DEMO  -  PRESS ENTER', W / 2, H - 14, '#fff', 1, 'out');
  }
  if (G.paused) drawPause();
  ctx.drawImage(vignette.c, 0, 0);
  if (G.crt) ctx.drawImage(scanlines.c, 0, 0);
}

// ============================================================================
// MAIN LOOP
// ============================================================================
var titleScene = null, titleT = 0, lastNow = 0;

function enterTitle() {
  G.state = 'title'; G.st = 0; G.demo = false; titleT = 0;
  if (!titleScene) titleScene = buildScene(1);
  scene = titleScene;
  enemies = []; knives = []; fx = []; words = []; coins = []; ghosts = [];
  player = newPlayer(120); player.state = 'win'; player.pose = 'idle';
  cam.x = 0; cam.min = 0; cam.max = scene.stageW - W; cam.shake = 0;
  musicSet('title');
}

function tick(dt) {
  pollGamepad();
  buildInput(dt);
  G.t += dt;
  if (pressed.mute) { setMute(!G.muted); SFX.select(); }
  if (pressed.crt) G.crt = !G.crt;
  if (pressed.pause && (G.state === 'play' || G.state === 'intro')) { G.paused = !G.paused; SFX.select(); }
  if (G.flashRed > 0) G.flashRed -= dt;
  if (G.flashWhite > 0) G.flashWhite -= dt;

  if (G.paused) { render(); pressed = {}; return; }

  switch (G.state) {
    case 'title': {
      titleT += dt; G.st += dt;
      cam.x = clamp(cam.x + 12 * dt, 0, cam.max);
      player.x = cam.x + 110; player.pose = Math.floor(G.t * 1.6) % 2 ? 'idle2' : 'idle';
      if (cam.x >= cam.max) cam.x = 0;
      if (pressed.start || pressed.punch || pressed.kick) { SFX.start(); resetGame(); }
      else if (titleT > 12) { resetGame(); G.demo = true; realInput = false; }
      break;
    }
    case 'intro': {
      G.st += dt;
      if (G.st > 0.9) updateWorld(Math.min(dt, 0.05));
      if (G.st > 2.2) { G.state = 'play'; G.st = 0; }
      if (G.demo && realInput) { enterTitle(); }
      break;
    }
    case 'play': {
      if (G.demo) { demoThink(dt); if (realInput || G.st > 40) { enterTitle(); break; } }
      G.st += dt;
      if (G.freeze > 0) { G.freeze -= dt; }
      else updateWorld(dt);
      break;
    }
    case 'clear': {
      G.st += dt;
      updateFx(dt); updateCamera(dt);
      // step back into frame before striking the victory pose
      var pc = player, edge = cam.x + W - 80;
      if (pc.x > edge && G.st < 2.6) { pc.x -= 70 * dt; pc.face = -1; pc.walkD += 70 * dt; pc.state = 'walk'; pc.pose = WALKSEQ[Math.floor(pc.walkD / 12) % 4]; }
      else if (pc.state !== 'win') { pc.state = 'win'; pc.pose = 'win'; pc.face = 1; }
      for (var i = enemies.length - 1; i >= 0; i--) { updateEnemy(enemies[i], dt); if (enemies[i].dead) enemies.splice(i, 1); }
      if (G.st > 3.6) { addScore(G.bonus); G.stage++; if (G.demo) enterTitle(); else startStage(); }
      break;
    }
    case 'over': {
      G.st += dt; updateFx(dt);
      if (G.st > 1.2 && (pressed.start || pressed.punch || pressed.kick)) enterTitle();
      if (G.st > 8 && G.demo) enterTitle();
      break;
    }
  }
  musicTick();
  render();
  pressed = {};
}

function frame(now) {
  if (!QA) window.requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - lastNow) / 1000 || 0.016);
  lastNow = now;
  tick(dt);
}

enterTitle();
if (!QA) window.requestAnimationFrame(frame);

// Debug / QA hook (see qa-harness.js).  Frames are driven manually with ?qa.
window.__NF = {
  W: W, H: H, GY: GY, POSE: POSE, KIT: KIT, HERO: HERO, PAL: PAL, cam: cam, G: G,
  drawFighter: drawFighter, drawShadow: drawShadow, buildScene: buildScene, text: text, textC: textC,
  ctx: function () { return ctx; }, player: function () { return player; }, enemies: function () { return enemies; },
  scene: function () { return scene; }, setScene: function (s) { scene = s; },
  frame: function (ms) { tick((ms || 16.7) / 1000); },
  key: function (code, down) { audioInit(); onKey(code, down); },
  startStage: function (n) { G.stage = n || 1; G.demo = false; startStage(); },
  spawn: function (type, x) { var e = makeEnemy(type, x); enemies.push(e); return e; },
  // Renders the kiai through an OfflineAudioContext so the harness can prove it
  // is not silent and that the formants really glide from "ee" to "ya".  Swaps
  // the module's AC/master/noiseBuf for offline ones, then puts them back.
  renderVoice: function (big) {
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return null;
    var oc = new OAC(1, 44100, 44100);
    var sAC = AC, sMaster = master, sNoise = noiseBuf;
    AC = oc;
    master = oc.createGain(); master.gain.value = 1; master.connect(oc.destination);
    noiseBuf = oc.createBuffer(1, oc.sampleRate * 0.5, oc.sampleRate);
    var d = noiseBuf.getChannelData(0), i;
    for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    voice(0, big);
    AC = sAC; master = sMaster; noiseBuf = sNoise;
    return oc.startRendering();
  },
  ai: function (dt) { demoThink(dt || 0.0167); },
  render: render
};
})();
</script>
</body>
</html>
